# Lives in the public Ssmunna/ss-tracker-desktop-version repo (copied there by
# scripts/publish-desktop.sh from the main repo). Public repos get free, unlimited runners.
name: Release desktop app

on:
    push:
        tags: ['v*']

permissions:
    contents: write

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Install Frontend dependencies
              run: npm ci
              working-directory: Frontend
            - name: Install Desktop dependencies
              run: npm ci
              working-directory: Desktop
            # `dist` builds the React app and the Electron main process, then runs electron-builder.
            - name: Build and upload to the release
              run: npm run dist -- --publish always
              working-directory: Desktop
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # electron-builder uploads every OS into one draft release; publish it once all three are in.
    publish:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
